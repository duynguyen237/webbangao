<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng ký tài khoản | Gạo Ngon Việt</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light min-vh-100 d-flex flex-column">

<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm py-3 mb-auto">
    <div class="container">
        <a class="navbar-brand fw-bold text-success fs-3" href="/"><i class="bi bi-leaf-fill me-2"></i>GẠO VIỆT</a>
    </div>
</nav>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-sm-10 col-md-8 col-lg-6 col-xl-5">

            <div class="card border-0 shadow-lg rounded-5 overflow-hidden bg-white">
                <div class="card-body p-4 p-md-5">

                    <div class="text-center mb-4">
                        <div class="bg-success-subtle text-success d-inline-flex align-items-center justify-content-center rounded-circle mb-3 shadow-sm" style="width: 70px; height: 70px;">
                            <i class="bi bi-person-plus display-6"></i>
                        </div>
                        <h2 class="fw-bold text-dark">Tạo tài khoản</h2>
                        <p class="text-muted small">Tham gia cộng đồng Gạo Ngon Việt ngay hôm nay</p>
                    </div>

                    <div th:if="${param.error}" class="alert alert-danger border-0 rounded-4 text-center small mb-4">
                        <i class="bi bi-exclamation-triangle me-2"></i>Tên đăng nhập này đã có người sử dụng
                    </div>

                    <form method="post" action="/web/register">
                        <div class="form-floating mb-3">
                            <input type="text" name="username" class="form-control bg-light border-0 rounded-4 px-4" id="regUser" placeholder="Username" required>
                            <label class="px-4 text-muted small">Tên đăng nhập</label>
                        </div>

                        <div class="form-floating mb-3">
                            <input type="password" name="password" class="form-control bg-light border-0 rounded-4 px-4" id="regPass" placeholder="Password" required>
                            <label class="px-4 text-muted small">Mật khẩu</label>
                        </div>

                        <div class="form-floating mb-4">
                            <input type="text" name="tenKhachHang" class="form-control bg-light border-0 rounded-4 px-4" id="regName" placeholder="Full Name" required>
                            <label class="px-4 text-muted small">Họ và tên của bạn</label>
                        </div>

                        <button type="submit" class="btn btn-success btn-lg w-100 rounded-pill fw-bold py-3 shadow-sm">
                            ĐĂNG KÝ NGAY <i class="bi bi-check2-circle ms-2"></i>
                        </button>
                    </form>

                    <div class="text-center mt-4 pt-3 border-top">
                        <p class="mb-1 text-muted small">Bạn đã có tài khoản rồi?</p>
                        <a href="/web/login" class="text-success fw-bold text-decoration-none">Quay lại Đăng nhập</a>
                    </div>

                </div>
            </div>

            <p class="text-center mt-4 text-muted small">Bằng việc đăng ký, bạn đồng ý với các điều khoản dịch vụ của chúng tôi.</p>

        </div>
    </div>
</div>

<div class="mt-auto"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
