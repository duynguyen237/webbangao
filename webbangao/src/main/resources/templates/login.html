<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng nhập | Gạo Ngon Việt</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light min-vh-100 d-flex flex-column">

<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm py-3 mb-auto">
    <div class="container">
        <a class="navbar-brand fw-bold text-success fs-3" href="/"><i class="bi bi-leaf-fill me-2"></i>GẠO VIỆT</a>
        <div class="ms-auto">
            <a href="/sanpham" class="btn btn-outline-success rounded-pill fw-bold">Xem Sản Phẩm</a>
        </div>
    </div>
</nav>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">

            <div class="card border-0 shadow-lg rounded-5 overflow-hidden bg-white">
                <div class="card-body p-4 p-md-5">

                    <div class="text-center mb-4">
                        <div class="bg-success-subtle text-success d-inline-flex align-items-center justify-content-center rounded-circle mb-3 shadow-sm" style="width: 70px; height: 70px;">
                            <i class="bi bi-person-lock display-6"></i>
                        </div>
                        <h2 class="fw-bold text-dark">Chào mừng trở lại</h2>
                        <p class="text-muted small">Vui lòng đăng nhập để tiếp tục mua sắm</p>
                    </div>

                    <div th:if="${param.error}" class="alert alert-danger border-0 rounded-4 text-center small mb-4">
                        <i class="bi bi-exclamation-circle me-2"></i>Sai tài khoản hoặc mật khẩu
                    </div>
                    <div th:if="${param.logout}" class="alert alert-success border-0 rounded-4 text-center small mb-4">
                        <i class="bi bi-check-circle me-2"></i>Đã đăng xuất thành công
                    </div>

                    <form method="post" action="/login">
                        <div class="form-floating mb-3">
                            <input type="text" name="username" class="form-control bg-light border-0 rounded-4 px-4" id="userInput" placeholder="Username" required>
                            <label class="px-4 text-muted small">Tên đăng nhập</label>
                        </div>
                        <div class="form-floating mb-4">
                            <input type="password" name="password" class="form-control bg-light border-0 rounded-4 px-4" id="passInput" placeholder="Password" required>
                            <label class="px-4 text-muted small">Mật khẩu</label>
                        </div>

                        <button type="submit" class="btn btn-success btn-lg w-100 rounded-pill fw-bold py-3 shadow-sm transition-up">
                            ĐĂNG NHẬP <i class="bi bi-box-arrow-in-right ms-2"></i>
                        </button>
                    </form>

                    <div class="text-center mt-4 pt-3 border-top">
                        <p class="mb-1 text-muted small">Bạn mới đến Gạo Việt?</p>
                        <a href="/web/register" class="text-success fw-bold text-decoration-none">Đăng ký tài khoản mới</a>
                    </div>

                </div>
            </div>

            <div class="text-center mt-4">
                <a href="/" class="text-secondary text-decoration-none small"><i class="bi bi-arrow-left me-1"></i>Về trang chủ</a>
            </div>

        </div>
    </div>
</div>

<div class="mt-auto"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
