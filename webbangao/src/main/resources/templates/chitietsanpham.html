<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${product.tenSanPham} + ' - Gạo Ngon Việt'">Chi tiết sản phẩm</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        /* Khung ảnh lớn */
        .main-image-container {
            width: 100%;
            height: 400px;
            border: 1px solid #e0e0e0;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            margin-bottom: 15px;
            background: #fff;
            position: relative;
        }

        .main-image-container img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        /* Danh sách ảnh nhỏ */
        .thumbnail-list {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 5px;
        }

        /* Từng ảnh nhỏ */
        .thumb-item {
            width: 70px;
            height: 70px;
            border: 1px solid #ddd;
            border-radius: 8px;
            cursor: pointer;
            opacity: 0.6;
            transition: all 0.2s;
            flex-shrink: 0;
            overflow: hidden;
        }

        .thumb-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Hiệu ứng khi chọn */
        .thumb-item:hover, .thumb-item.active {
            border: 2px solid #198754;
            opacity: 1;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-light bg-white sticky-top shadow-sm py-3">
    <div class="container">
        <a class="navbar-brand fw-bold text-success fs-3" href="/"><i class="bi bi-leaf-fill me-2"></i>GẠO VIỆT</a>
        <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav ms-auto align-items-center gap-2">
                <li class="nav-item"><a class="nav-link fw-semibold" href="/sanpham">Sản phẩm</a></li>

                <li class="nav-item" th:if="${khachHang != null}">
                    <a class="nav-link fw-semibold" href="/lich-su-hoa-don"><i class="bi bi-clock-history me-1"></i>Lịch sử</a>
                </li>

                <li class="nav-item" th:if="${isAdmin}">
                    <a class="btn btn-danger fw-bold rounded-pill px-3 shadow-sm" href="/admin/them-san-pham">
                        <i class="bi bi-gear-fill me-1"></i> QUẢN TRỊ
                    </a>
                </li>

                <li class="nav-item dropdown" th:if="${khachHang != null or isAdmin}">
                    <a class="nav-link dropdown-toggle fw-bold text-success bg-light rounded-pill px-3" href="#" data-bs-toggle="dropdown">
                        <i class="bi bi-person-circle me-1"></i>
                        <span th:text="${isAdmin ? 'ADMIN VIP' : khachHang.tenKhachHang}"></span>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end border-0 shadow-lg mt-3 rounded-4 overflow-hidden">
                        <li>
                            <form th:action="@{/logout}" method="post" class="m-0 p-2">
                                <button type="submit" class="dropdown-item text-danger rounded py-2 fw-bold"><i class="bi bi-box-arrow-right me-2"></i>Đăng xuất</button>
                            </form>
                        </li>
                    </ul>
                </li>

                <li class="nav-item" th:unless="${khachHang != null or isAdmin}">
                    <a class="btn btn-success rounded-pill px-4 fw-bold shadow-sm" href="/web/login">Đăng nhập</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container py-5">
    <div class="card border-0 shadow rounded-5 p-4 p-md-5 bg-white">
        <div class="row align-items-start">
            <div class="col-md-5">
                <div class="product-gallery">
                    <div class="main-image-container shadow-sm">
                        <img id="mainImage"
                             th:src="${product.imageUrl != null and product.imageUrl.startsWith('http') ? product.imageUrl : '/images/' + product.imageUrl}"
                             alt="Ảnh sản phẩm">
                    </div>

                    <div class="thumbnail-list">
                        <div class="thumb-item active"
                             th:onclick="changeImage(this, [[${product.imageUrl != null and product.imageUrl.startsWith('http') ? product.imageUrl : '/images/' + product.imageUrl}]])">
                            <img th:src="${product.imageUrl != null and product.imageUrl.startsWith('http') ? product.imageUrl : '/images/' + product.imageUrl}">
                        </div>

                        <div class="thumb-item" th:each="img : ${listAnh}"
                             th:onclick="changeImage(this, [[${img.tenAnh != null and img.tenAnh.startsWith('http') ? img.tenAnh : '/images/' + img.tenAnh}]])">
                            <img th:src="${img.tenAnh != null and img.tenAnh.startsWith('http') ? img.tenAnh : '/images/' + img.tenAnh}">
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-7 ps-md-5">
                <h1 class="fw-bold display-4" th:text="${product.tenSanPham}"></h1>

                <span class="badge bg-success-subtle text-success fs-6 mb-3"
                      th:text="${product.danhMuc != null ? product.danhMuc.tenDanhMuc : 'Chưa phân loại'}"></span>

                <div class="p-4 rounded-4 my-4 bg-light">
                    <span class="text-danger display-4 fw-bold" th:text="${#numbers.formatDecimal(product.gia, 0, 'COMMA', 0, 'POINT')}"></span>
                    <span class="fs-3 text-danger fw-bold"> đ/kg</span>
                </div>
                <div class="mb-5 text-muted fs-5" th:utext="${product.moTa}"></div>

                <div class="d-flex gap-3">
                    <div th:if="${khachHang != null}">
                        <a th:href="@{/vnpay/pay(amount=${product.gia.longValue()}, khachHangId=${khachHang.khachHangID})}"
                           class="btn btn-success btn-lg px-5 py-3 rounded-pill fw-bold shadow">THANH TOÁN NGAY</a>
                    </div>

                    <div th:if="${khachHang == null and !isAdmin}">
                        <a href="/web/login" class="btn btn-warning btn-lg px-5 py-3 rounded-pill fw-bold">ĐĂNG NHẬP ĐỂ MUA</a>
                    </div>

                    <div th:if="${isAdmin}">
                        <button class="btn btn-secondary btn-lg px-5 py-3 rounded-pill fw-bold disabled">CHẾ ĐỘ ADMIN (Không mua)</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<footer class="text-center py-4 text-muted">
    <div class="container">
        <hr class="mb-4 opacity-25">
        <p class="small mb-0">© 2026 Gạo Ngon Việt - Thanh toán an toàn và bảo mật</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
    function changeImage(element, newSrc) {
        var mainImg = document.getElementById('mainImage');
        mainImg.style.opacity = 0;

        setTimeout(function(){
            mainImg.src = newSrc;
            mainImg.style.opacity = 1;
        }, 100);

        var thumbs = document.querySelectorAll('.thumb-item');
        thumbs.forEach(t => t.classList.remove('active'));
        element.classList.add('active');
    }
    document.getElementById('mainImage').style.transition = "opacity 0.2s ease-in-out";
</script>

</body>
</html>
