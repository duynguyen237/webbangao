<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Thêm Sản Phẩm Mới</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
  <div class="card shadow-sm col-md-8 mx-auto border-0 rounded-4">
    <div class="card-header bg-success text-white text-center py-3 rounded-top-4">
      <h4 class="mb-0 fw-bold">NHẬP KHO SẢN PHẨM MỚI</h4>
    </div>
    <div class="card-body p-4">

      <form th:action="@{/admin/them-san-pham}" th:object="${sanPham}" method="post" enctype="multipart/form-data">

        <div class="mb-3">
          <label class="form-label fw-bold">Tên sản phẩm</label>
          <input type="text" th:field="*{tenSanPham}" class="form-control" placeholder="Ví dụ: Gạo ST25 Ông Cua" required>
        </div>

        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label fw-bold">Giá bán (VNĐ)</label>
            <input type="number" th:field="*{gia}" class="form-control" placeholder="VNĐ" required>
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label fw-bold">Số lượng tồn</label>
            <input type="number" th:field="*{soLuongTon}" class="form-control" value="100">
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label fw-bold">Thuộc danh mục</label>
          <div class="input-group">
            <select th:field="*{danhMuc}" class="form-select">
              <option th:each="dm : ${listDanhMuc}"
                      th:value="${dm.id}"
                      th:text="${dm.tenDanhMuc}"></option>
            </select>
            <a href="/admin/them-danh-muc" class="btn btn-outline-secondary">+ Tạo mới</a>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label fw-bold">Ảnh đại diện</label>
          <input type="file" name="imageFile" class="form-control" accept="image/*" required>
          <div class="form-text text-muted">Hỗ trợ định dạng: .jpg, .png, .jpeg</div>
        </div>

        <div class="mb-3">
          <label class="form-label fw-bold">Mô tả chi tiết</label>
          <textarea th:field="*{moTa}" class="form-control" rows="4" placeholder="Viết mô tả hấp dẫn..."></textarea>
        </div>

        <div class="d-grid gap-2">
          <button type="submit" class="btn btn-success btn-lg fw-bold">LƯU SẢN PHẨM</button>
          <a href="/sanpham" class="btn btn-outline-secondary">Hủy bỏ</a>
        </div>
      </form>

    </div>
  </div>
</div>

</body>
</html>
