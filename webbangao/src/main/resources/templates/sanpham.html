<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Danh Sách Gạo Sạch - Gạo Ngon Việt</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-light bg-white sticky-top shadow-sm py-3">
    <div class="container">
        <a class="navbar-brand fw-bold text-success fs-3" href="/"><i class="bi bi-leaf-fill me-2"></i>GẠO VIỆT</a>
        <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav ms-auto align-items-center gap-2">
                <li class="nav-item"><a class="nav-link fw-semibold" href="/sanpham">Sản phẩm</a></li>

                <li class="nav-item" th:if="${khachHang != null}">
                    <a class="nav-link fw-semibold" href="/lich-su-hoa-don"><i class="bi bi-clock-history me-1"></i>Lịch sử</a>
                </li>

                <li class="nav-item" th:if="${isAdmin}">
                    <a class="btn btn-danger fw-bold rounded-pill px-3 shadow-sm" href="/admin/them-san-pham">
                        <i class="bi bi-gear-fill me-1"></i> QUẢN TRỊ
                    </a>
                </li>

                <li class="nav-item dropdown" th:if="${khachHang != null or isAdmin}">
                    <a class="nav-link dropdown-toggle fw-bold text-success bg-light rounded-pill px-3" href="#" data-bs-toggle="dropdown">
                        <i class="bi bi-person-circle me-1"></i>
                        <span th:text="${isAdmin ? 'ADMIN VIP' : khachHang.tenKhachHang}"></span>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end border-0 shadow-lg mt-3 rounded-4 overflow-hidden">
                        <li>
                            <form th:action="@{/logout}" method="post" class="m-0 p-2">
                                <button type="submit" class="dropdown-item text-danger rounded py-2 fw-bold"><i class="bi bi-box-arrow-right me-2"></i>Đăng xuất</button>
                            </form>
                        </li>
                    </ul>
                </li>

                <li class="nav-item" th:unless="${khachHang != null or isAdmin}">
                    <a class="btn btn-success rounded-pill px-4 fw-bold shadow-sm" href="/web/login">Đăng nhập</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container py-5">
    <div class="text-center mb-5">
        <h1 class="fw-bold display-5 text-dark">Danh Mục Gạo Sạch</h1>
        <p class="text-muted fs-5">Lựa chọn tinh hoa lúa gạo Việt cho sức khỏe gia đình bạn</p>
        <div class="bg-success mx-auto rounded-pill shadow-sm" style="height: 5px; width: 100px;"></div>
    </div>

    <div class="row g-4">
        <div class="col-6 col-md-4 col-lg-3" th:each="sp : ${sanPhams}">
            <div class="card border-0 rounded-4 shadow-sm h-100 text-center p-3 bg-white border border-transparent hover-border-success transition-all" style="transition: 0.3s;">

                <div class="overflow-hidden rounded-4 mb-3 position-relative">
                    <img th:src="${sp.imageUrl != null and sp.imageUrl.startsWith('http') ? sp.imageUrl : '/images/' + sp.imageUrl}"
                         class="w-100" style="height: 200px; object-fit: cover; transition: 0.5s;"
                         onmouseover="this.style.transform='scale(1.1)'" onmouseout="this.style.transform='scale(1)'">
                </div>

                <div class="card-body p-0 d-flex flex-column">
                    <span class="badge bg-success-subtle text-success rounded-pill mb-2 w-fit-content mx-auto px-3 py-2 fw-bold"
                          th:text="${sp.danhMuc != null ? sp.danhMuc.tenDanhMuc : 'Chưa phân loại'}">
                    </span>

                    <h5 class="fw-bold text-dark mb-1 text-truncate px-2" th:text="${sp.tenSanPham}"></h5>

                    <p class="text-danger fw-bold fs-5 mb-3"
                       th:text="${#numbers.formatDecimal(sp.gia,0,'COMMA',0,'POINT')} + ' đ/kg'"></p>

                    <div class="mt-auto px-2">
                        <a th:href="@{/san-pham/{id}(id=${sp.sanPhamID})}" class="btn btn-outline-success rounded-pill fw-bold w-100 py-2 border-2">
                            Xem Chi Tiết
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:if="${#lists.isEmpty(sanPhams)}" class="text-center py-5">
        <i class="bi bi-box2 display-1 text-muted"></i>
        <p class="mt-3 fs-5 text-muted">Hiện chưa có sản phẩm nào được bày bán.</p>
        <a th:if="${isAdmin}" href="/admin/them-san-pham" class="btn btn-primary mt-3">Thêm sản phẩm ngay</a>
    </div>
</div>

<footer class="bg-white py-5 mt-5 border-top">
    <div class="container text-center">
        <p class="fw-bold text-success mb-2">🌾 GẠO NGON VIỆT</p>
        <p class="text-muted small mb-0">Hệ thống cung cấp nông sản sạch chuẩn VietGAP</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
